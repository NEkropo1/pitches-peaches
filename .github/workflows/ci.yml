name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The tool claims to be cross-platform, so prove it rather than hope.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 only — the package declares requires-python >=3.14 and nothing
        # older is supported. uv fetches the interpreter on every runner.
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # No network, no API key. The e2e suite is skipped unless --e2e is
      # passed, which CI deliberately never does — it costs real money.
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      # Catches a README that PyPI would reject, before a tag exists.
      - name: Check the distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean environment
        run: |
          uv venv --python 3.14 /tmp/fresh
          uv pip install --python /tmp/fresh dist/*.whl
          /tmp/fresh/bin/peaches version
          # Prompts are package data; a wheel missing them fails only at runtime.
          # Every prompt is rendered with whatever it declares it needs, rather
          # than one prompt with arguments written out here — that hardcoding
          # broke this step the first time a prompt gained a placeholder, which
          # is a check failing for a reason that has nothing to do with wheels.
          /tmp/fresh/bin/python -c "
          from pitches_peaches.prompts import names, render, required
          shipped = names()
          assert {'match', 'probes', 'recon_research', 'narration'} <= set(shipped), shipped
          for name in shipped:
              render(name, **{key: 'x' for key in required(name)})
          assert 'self-reported' in render('match', **{k: 'x' for k in required('match')})
          print(f'{len(shipped)} prompts load from the installed wheel')
          "

      # A sdist that cannot run its own suite is missing files. MANIFEST.in
      # decides that, and nothing else here would notice it drifting.
      - name: Run the suite from the sdist
        run: |
          mkdir /tmp/sdist
          tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist
          uv run --python 3.14 --no-project --with '.[dev]' pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
