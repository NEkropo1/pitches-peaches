[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitches-peaches"
version = "0.1.0"
description = "Turn a job posting and your CV into an interview prep dossier. It never applies to anything."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Savchuck", email = "nekrjkeee@gmail.com" }]
keywords = ["interview", "job", "cv", "prep", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.75",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
audio = ["kokoro>=0.9", "soundfile>=0.12"]
openai = ["openai>=3.0"]
gemini = ["google-genai>=2.0"]
all-providers = ["openai>=3.0", "google-genai>=2.0"]
# The provider tests check schema portability against the real SDKs, so dev
# pulls them in even though a plain install does not.
dev = ["pytest>=8.0", "openai>=3.0", "google-genai>=2.0"]

[project.urls]
Homepage = "https://github.com/nekropol/pitches-peaches"
Issues = "https://github.com/nekropol/pitches-peaches/issues"

[project.scripts]
peaches = "pitches_peaches.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitches_peaches = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: makes real Anthropic API calls; costs money; opt in with --e2e",
    "slow: a full-pipeline run rather than a single call",
]
